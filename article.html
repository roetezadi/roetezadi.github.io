<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Notebook | Romina Etezadi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Tabs -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html#about" class="nav-brand">Romina Etezadi</a>
            <div class="nav-links">
                <a href="index.html#about">About</a>
                <a href="index.html#interests">Interests</a>
                <a href="index.html#news">News</a>
                <a href="index.html#publications">Publications</a>
                <a href="blog.html" class="nav-special nav-active">My AI Notebook</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <article id="article" class="blog-article">
            <h2 id="article-title"></h2>
            <p id="article-date" class="post-date"></p>
            <div id="article-content" class="article-content"></div>
        </article>

        <footer>
            <p><a href="blog.html">← Back to All Articles</a></p>
            <p>&copy; 2026 Romina Etezadi.</p>
        </footer>
    </div>

    <script src="posts.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get("id");
        const post = POSTS.find(p => p.id === id);

        if (post) {
            document.title = post.title + " | Romina Etezadi";
            document.getElementById("article-title").textContent = post.title;
            document.getElementById("article-date").textContent =
                new Date(post.date + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
            document.getElementById("article-content").innerHTML = post.content;
        } else {
            document.getElementById("article-title").textContent = "Article not found";
            document.getElementById("article-content").innerHTML =
                '<p>Sorry, this article does not exist. <a href="blog.html">See all articles</a>.</p>';
        }
    </script>

</body>
</html>
