<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b80"/>
    </marker>
  </defs>
  <rect width="760" height="220" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="20" y="60" width="150" height="80" rx="8" fill="#e8f1fb" stroke="#1f6fbf" stroke-width="1.5"/>
  <text x="95" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Requirement</text>
  <text x="95" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Change</text>

  <!-- Step 2 -->
  <rect x="210" y="60" width="150" height="80" rx="8" fill="#e8f1fb" stroke="#1f6fbf" stroke-width="1.5"/>
  <text x="285" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Candidate</text>
  <text x="285" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Retrieval</text>
  <text x="285" y="160" text-anchor="middle" font-size="12" fill="#5a6b80">cheap embedding filter</text>

  <!-- Step 3 -->
  <rect x="400" y="60" width="150" height="80" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-width="1.5"/>
  <text x="475" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">LLM</text>
  <text x="475" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Reasoning</text>
  <text x="475" y="160" text-anchor="middle" font-size="12" fill="#5a6b80">only on top-k candidates</text>

  <!-- Step 4 -->
  <rect x="590" y="60" width="150" height="80" rx="8" fill="#e9f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="665" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Impacted</text>
  <text x="665" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2b3c">Requirements</text>

  <!-- Arrows -->
  <line x1="172" y1="100" x2="207" y2="100" stroke="#5a6b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="362" y1="100" x2="397" y2="100" stroke="#5a6b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="552" y1="100" x2="587" y2="100" stroke="#5a6b80" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="380" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b3c">Two-stage change impact analysis</text>
</svg>
